packages:
  - 'packages/*'
  - playground
  - docs
shamefullyHoist: true
strictPeerDependencies: false
ignoreWorkspaceRootCheck: true
catalog:
  '@types/three': ^0.186.0
  gsap: ^3.15.0
  nanoid: ^5.1.16
  three: ^0.186.1
  vue-component-type-helpers: ^3.3.13
  vue-draggable-plus: ^0.6.1
overrides:
  '@vue/compiler-core': ^3.5.43
  vue: ^3.5.43
patchedDependencies:
  vue: patches/vue.patch
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  pnpm: true
  simple-git-hooks: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@tsdown/css@0.23.1'
  - rolldown-plugin-dts@0.28.7
  - tsdown@0.23.1
  - vue-component-type-helpers@3.3.13
